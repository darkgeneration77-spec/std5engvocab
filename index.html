const EMOJI=['🎨','🏙️','⏰','🦋','📚','🥑','🏆','🌱','🧳'];
const app=document.getElementById('app');
const key='scoopspell_year5_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};
let unit=0,stage=0,idx=0,points=0,questions=[],answered=false,misses=[];let studentName=String(saved.studentName||'');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(t){if(!('speechSynthesis'in window)){alert('Speech is unavailable in this browser. Try Chrome or Edge.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase().startsWith('en-gb'))||voices.find(x=>x.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}
function header(title,subtitle){return `<div class="row space noprint"><button class="btn alt" onclick="home()">← Flavour Map</button><span class="pill">${esc(UNITS[unit].name)}</span></div><h2 class="center">${title}</h2><p class="center">${subtitle}</p>`}
function setStudentName(){const el=document.getElementById('studentName');const value=(el?.value||'').trim();if(!value){alert('Please enter your student name.');el?.focus();return}studentName=value;saved.studentName=value;store();home()}
function announceScore(pct,passed){if(!('speechSynthesis' in window))return;const name=studentName||'Student';const msg=name+', your score is '+pct+' percent. '+(passed?'Congratulations! You have passed.':'You need at least 80 percent to pass. Please try again.');speak(msg)}
function home(){stage=0;app.innerHTML=`<div class="card center"><h2>Student Name · 学生姓名</h2><input class="field" id="studentName" maxlength="60" placeholder="Enter your name" value="${esc(studentName)}" aria-label="Student name"><p><button class="btn mint" onclick="setStudentName()">Save Name ✓</button></p><p class="tiny">Pass mark: 80% or above. Your name will appear on your certificate.</p></div><div class="center"><h2>Choose your flavour 🍧</h2><p>Complete each flavour with 80% or above to unlock the next one.</p></div><div class="grid">${UNITS.map((u,i)=>{let unlocked=i===0||saved[i-1]?.passed;let s=saved[i];return `<button class="unit" ${unlocked?'':'disabled'} onclick="start(${i})"><div class="em">${unlocked?EMOJI[i]:'🔒'}</div><strong>${i===0?'Starter':'Unit '+i} · ${esc(u.name)}</strong><small>${u.words.length} words · ${s?.passed?'🏅 Passed '+s.score+'%':unlocked?'Ready to explore':'Locked'}</small></button>`}).join('')}</div><p class="center tiny">Learn → Listening → Spelling → Application. Each assessment must reach 80% to pass the unit.</p>`}
function start(i){if(!studentName.trim()){alert('Please enter and save your student name first.');document.getElementById('studentName')?.focus();return}unit=i;stage=0;idx=0;learn()}
function learn(){let a=UNITS[unit].words,w=a[idx];app.innerHTML=header('🍬 Scoop & Learn','Listen, read and remember each word.')+`<div class="progress"><div class="bar" style="width:${(idx+1)/a.length*100}%"></div></div><div class="center tiny">WORD ${idx+1} / ${a.length}</div><div class="card center"><div class="stars">✦ ✦ ✦</div><div class="bigword">${esc(w.w)}</div><div class="meaning">${esc(w.zh)}</div>${w.def?`<p class="def">${esc(w.def)}</p>`:''}${w.pos?`<p class="tiny">${esc(w.pos)}</p>`:''}<button class="btn alt" onclick="speak(${esc(JSON.stringify(w.w))})">🔊 Hear the word</button></div><div class="row space noprint"><button class="btn alt" ${idx===0?'disabled':''} onclick="idx--;learn()">← Previous</button><button class="btn mint" onclick="${idx===a.length-1?'begin(1)':'idx++;learn()'}">${idx===a.length-1?'Start Listening →':'Next Scoop →'}</button></div>`}
function pool(){return UNITS[unit].words.filter(x=>x.w&&x.w.length>1)}
function begin(s){stage=s;idx=0;points=0;answered=false;misses=[];let p=pool();if(s===1||s===2)questions=shuffle(p).slice(0,Math.min(10,p.length));else{questions=shuffle(p.filter(x=>x.def)).slice(0,Math.min(10,p.filter(x=>x.def).length));if(questions.length<5){questions=shuffle(p).slice(0,Math.min(10,p.length))}}showQuestion()}
function showQuestion(){if(idx>=questions.length){finishStage();return}answered=false;let w=questions[idx];let names=['','🔊 Listening Challenge','✏️ Spelling Challenge','🧠 Application Challenge'];let sub=['','Hear the word and choose the correct meaning.','Listen and type the complete English word.','Read the definition and choose the correct word.'];let content='';if(stage===1){let opts=shuffle([w,...shuffle(pool().filter(x=>x.w!==w.w&&x.zh!==w.zh)).slice(0,3)]);content=`<button class="btn alt" onclick="speak(${esc(JSON.stringify(w.w))})">🔊 PLAY WORD</button><p class="tiny">Choose the Chinese meaning</p>${opts.map(x=>`<button class="choice" data-answer="${esc(x.w)}" onclick="choose(this)">${esc(x.zh)}</button>`).join('')}`}else if(stage===2){content=`<button class="btn alt" onclick="speak(${esc(JSON.stringify(w.w))})">🔊 PLAY WORD</button><p class="tiny">Meaning: ${esc(w.zh)}</p><input class="field" id="spell" placeholder="Type the English word" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkSpell()"><p><button class="btn" id="check" onclick="checkSpell()">Check spelling</button></p>`}else{let opts=shuffle([w,...shuffle(pool().filter(x=>x.w!==w.w)).slice(0,3)]);content=`<p class="def"><strong>${esc(w.def||w.zh)}</strong></p><p class="tiny">Choose the matching English word</p>${opts.map(x=>`<button class="choice" data-answer="${esc(x.w)}" onclick="choose(this)">${esc(x.w)}</button>`).join('')}`}
app.innerHTML=header(names[stage],sub[stage])+`<div class="progress"><div class="bar" style="width:${idx/questions.length*100}%"></div></div><div class="center tiny">QUESTION ${idx+1} / ${questions.length}</div><div class="card center">${content}<div id="feedback" aria-live="polite"></div><button class="btn mint hide" id="next" onclick="idx++;showQuestion()">${idx===questions.length-1?'View result →':'Next →'}</button></div>`;if(stage===1||stage===2)setTimeout(()=>speak(w.w),250)}
function result(ok){if(answered)return;answered=true;let w=questions[idx];if(ok)points++;else misses.push(w);let f=document.getElementById('feedback');f.innerHTML=`<div class="notice" style="background:${ok?'#d9f8e8':'#ffe4df'}">${ok?'✓ Correct!':'✗ Not quite.'} Answer: <strong>${esc(w.w)}</strong> · ${esc(w.zh)}</div><button class="btn alt" onclick="speak(${esc(JSON.stringify(w.w))})">🔊 Listen again</button>`;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;b.classList.add(b.dataset.answer===w.w?'good':'bad')});let c=document.getElementById('check');if(c)c.disabled=true;let inp=document.getElementById('spell');if(inp)inp.disabled=true;document.getElementById('next').classList.remove('hide')}
function choose(b){if(answered)return;result(b.dataset.answer===questions[idx].w)}
function checkSpell(){if(answered)return;let v=document.getElementById('spell').value.trim().replace(/\s+/g,' ').toLowerCase();if(!v){document.getElementById('spell').focus();return}result(v===questions[idx].w.toLowerCase())}
let stageScores=[];
function finishStage(){let pct=Math.round(points/questions.length*100);stageScores[stage-1]=pct;let passed=pct>=80;announceScore(pct,passed);let next=stage===3?'certificate()':`begin(${stage+1})`;app.innerHTML=header(passed?'🎉 Sweet Success!':'🍓 Keep Scooping!','You need at least 80% to advance.')+`<div class="card center"><div class="score">${pct}%</div><h2>${passed?'Stage passed!':'Try again to unlock the next stage'}</h2><p>${points} / ${questions.length} correct</p>${misses.length?`<details style="text-align:left"><summary>Review missed words (${misses.length})</summary><ul>${misses.map(x=>`<li><b>${esc(x.w)}</b> — ${esc(x.zh)}</li>`).join('')}</ul></details>`:''}<div class="row" style="justify-content:center;margin-top:22px"><button class="btn alt" onclick="begin(${stage})">Retry stage</button>${passed?`<button class="btn mint" onclick="${next}">${stage===3?'My Certificate 🏅':'Next Stage →'}</button>`:''}</div></div>`;if(stage===3&&passed){let score=Math.round(stageScores.reduce((a,b)=>a+b,0)/3);saved[unit]={passed:true,score,stages:[...stageScores],date:new Date().toLocaleDateString('en-GB'),studentName:studentName};store()}}
function certificate(){let s=saved[unit];if(!s?.passed){home();return}let name=s.studentName||studentName||saved.studentName||'Student';app.innerHTML=`<div class="noprint row space"><button class="btn alt" onclick="home()">← Flavour Map</button><button class="btn" onclick="window.print()">🖨️ Print / Save PDF</button></div><div class="certificate"><div style="font-size:58px">🏆 🍦 🧸</div><h2>Certificate of Achievement</h2><p>This certificate is proudly awarded to</p><h2>${esc(name)}</h2><p>for successfully completing</p><h3>YEAR 5 VOCABULARY · ${esc(UNITS[unit].name)}</h3><div class="score">${s.score}%</div><p>Listening · Spelling · Application</p><p>PASS · Minimum 80%</p><p>${esc(s.date)}</p><p class="tiny">Scoop & Spell Vocabulary Ice Cream Lab</p></div><p class="center noprint"><button class="btn mint" onclick="home()">Explore next flavour →</button></p>`}
